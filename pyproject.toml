[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dmm-calibration"
version = "0.2.0"
description = "台式万用表自动校准软件 Windows 客户端"
readme = "README.md"
requires-python = "==3.13.14"
dependencies = [
    "PySide6==6.8.3",
]

[project.gui-scripts]
dmm-calibration = "dmm_calibration.bootstrap:main"

[tool.setuptools.packages.find]
where = ["src"]
